# Common reverse-proxy settings for the NestJS api service.
proxy_pass http://tam_api;
# Keep-alive to the upstream needs HTTP/1.1 and no "Connection: close".
proxy_http_version 1.1;
proxy_set_header Connection "";
# $http_host keeps the port: the api checks the host name (ALLOWED_HOSTS) and its CSRF fallback
# compares Origin with Host.
proxy_set_header Host $http_host;
# The client address replaces anything a client sent (never appended): the api trusts exactly one
# proxy hop (TRUST_PROXY=1), so X-Forwarded-For cannot be used to dodge the login limits.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_hide_header X-Powered-By;
