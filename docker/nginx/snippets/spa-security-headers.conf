# Security headers for the Angular SPA (the API sets its own on /api/ responses).
# Included per location: an add_header inside a location replaces the inherited ones.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# script-src 'self': the theme bootstrap is an external file (theme-init.js) and critical-CSS
# inlining is off, so no inline script or event handler is needed. Angular injects component
# styles at runtime, hence style-src 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
