# Security headers for the Angular SPA (the API sets its own on /api/ responses).
# Included per location: an add_header inside a location replaces the inherited ones.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# The same policy as the api's (apps/api/src/bootstrap/security-headers.ts). Everything comes from
# this origin: fonts are part of the build. script-src 'self': the theme bootstrap is an external
# file (theme-init.js) and critical-CSS inlining is off. Angular injects component styles at
# runtime, hence style-src 'unsafe-inline'. No upgrade-insecure-requests: the LAN setup is plain
# HTTP (a TLS proxy in front may add it together with HSTS).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
