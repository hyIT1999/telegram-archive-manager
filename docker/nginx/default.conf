# nginx for the web container: serves the Angular build and reverse-proxies /api/ to the api.
# Put TLS termination (HTTPS + HTTP/2) in front of this in production — see README §11.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 10m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Liveness probe for Docker / load balancers.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ---- API ----------------------------------------------------------------------------------

  # Server-Sent Events (realtime progress, Phase 7): no buffering, long-lived connection.
  location = /api/events {
    include /etc/nginx/snippets/proxy-to-api.conf;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /api/ {
    include /etc/nginx/snippets/proxy-to-api.conf;
    # Range requests (video/audio seeking) pass through untouched; large media is streamed
    # to the client instead of being spooled to a temp file.
    proxy_max_temp_file_size 0;
    # Telegram RPC calls wait up to 30 s for the worker.
    proxy_read_timeout 120s;
  }

  # ---- SPA ----------------------------------------------------------------------------------

  # Build outputs with a content hash in the name (main-XXXXXXXX.js, styles-XXXXXXXX.css) never change.
  location ~* "-[A-Za-z0-9_]{8}\.(?:js|css)$" {
    include /etc/nginx/snippets/spa-security-headers.conf;
    expires 1y;
    access_log off;
    try_files $uri =404;
  }

  # The entry point must always be revalidated so new deployments are picked up.
  location = /index.html {
    include /etc/nginx/snippets/spa-security-headers.conf;
    expires -1;
  }

  # Client-side routes (/dashboard, /channels/…) fall back to index.html.
  location / {
    include /etc/nginx/snippets/spa-security-headers.conf;
    expires 1h;
    try_files $uri $uri/ /index.html;
  }
}
