# nginx for the web container (nginx-unprivileged): serves the Angular build and reverse-proxies
# /api/ to the api. Plain HTTP for a LAN; for HTTPS put a TLS proxy in front (README §11).

# Docker's DNS. The api's address is looked up again when it changes (a recreated container),
# instead of only when nginx starts.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream tam_api {
  zone tam_api 64k;
  server api:3100 resolve;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 10m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  # Liveness probe for Docker / load balancers.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ---- API ----------------------------------------------------------------------------------

  # Live updates (server-sent events): no buffering, long-lived connection.
  location = /api/events {
    include /etc/nginx/snippets/proxy-to-api.conf;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # ^~: no regex location below ever catches an /api/ path.
  location ^~ /api/ {
    include /etc/nginx/snippets/proxy-to-api.conf;
    # Range requests (video/audio seeking) pass through untouched; large media is streamed
    # to the client instead of being spooled to a temp file.
    proxy_max_temp_file_size 0;
    # Telegram RPC calls wait up to 30 s for the worker.
    proxy_read_timeout 120s;
  }

  # ---- SPA ----------------------------------------------------------------------------------

  # Build outputs named after their content hash never change: main-XXXXXXXX.js,
  # chunk-XXXXXXXX.js (mixed case, "-" and "_" allowed), styles-XXXXXXXX.css, media/font-XXXXXXXX.woff2.
  location ~ "^/(?:(?:chunk|main|polyfills|styles|worker)-[A-Za-z0-9_-]{8,}\.(?:js|mjs|css)|media/[^/]+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+)$" {
    include /etc/nginx/snippets/spa-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
  }

  # Everything else, index.html first of all, is revalidated so new deployments show at once.
  location = /index.html {
    include /etc/nginx/snippets/spa-security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Client-side routes (/dashboard, /channels/…) fall back to index.html.
  location / {
    include /etc/nginx/snippets/spa-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
