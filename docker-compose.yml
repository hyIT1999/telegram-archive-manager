# Unofficial Telegram Archive Manager — production stack for a Linux Docker host on a LAN.
#   cp .env.example .env   # fill in the "Docker Compose only" section and TELEGRAM_*
#   docker compose up -d --build
#   docker compose exec api node apps/api/dist/cli/create-user.js --email you@example.com
# Services receive only the variables they need (no shared env_file): Telegram credentials reach
# the worker alone, PostgreSQL's superuser password reaches PostgreSQL alone. Windows Server 2019
# cannot run these Linux containers; validate on Linux with scripts/compose-smoke.sh.

name: tam

x-database-url: &database-url postgresql://tam:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tam
x-redis-url: &redis-url redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0

# Log files rotate instead of filling the disk.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: '5'

# The application containers run as an unprivileged user, with no Linux capabilities, on a
# read-only root filesystem (writable: /tmp and their volumes).
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp
  logging: *logging

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    environment:
      # PostgreSQL's own superuser: only its entrypoint and the init script use it.
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      # The archive's role (not a superuser), created by docker/postgres/init with its databases.
      TAM_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Same text semantics as the Windows dev database: UTF-8, builtin collation and a
      # Unicode-aware ctype (never plain C, or pg_trgm stops treating Vietnamese letters as letters).
      POSTGRES_INITDB_ARGS: >-
        --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8
    volumes:
      # PostgreSQL 18 images keep the cluster under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tam']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.11
    restart: unless-stopped
    <<: *hardening
    # The image's own unprivileged user; /data belongs to it.
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # The password goes into a config file (on the /tmp tmpfs), not onto the command line.
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass %s\nappendonly yes\nmaxmemory-policy noeviction\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: applies Prisma migrations as the archive's role (the owner of its database), then exits.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    logging: *logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    <<: *hardening
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-tam}
      API_HOST: 0.0.0.0
      API_PORT: '3100'
      # Keep false for plain HTTP on the LAN (browsers drop Secure cookies on http); true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_ABSOLUTE_TTL_DAYS: ${SESSION_ABSOLUTE_TTL_DAYS:-30}
      # The addresses people type to open the archive. Their host names (and ALLOWED_HOSTS) are the
      # only names the api answers for; IP addresses always work.
      CSRF_TRUSTED_ORIGINS: ${WEB_ORIGINS:-http://localhost:8080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # Exactly one proxy hop: nginx (web), which writes the client address into X-Forwarded-For.
      TRUST_PROXY: '1'
      # Storage locations (README §9). The api checks and serves the folders, so it mounts the same
      # media volume as the worker. To offer more folders, mount them into both containers
      # (e.g. /data/nas) and list them here, separated by ";".
      STORAGE_LOCAL_ROOT: /data/storage
      STORAGE_LOCAL_ROOTS: /data/storage
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Shown in Settings; the worker enforces it. Thumbnails live in /data/storage/.tam-thumbnails.
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-2048}
    volumes:
      - media:/data/storage
    expose:
      - '3100'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    init: true
    <<: *hardening
    # Exactly one worker: it owns the single Telegram connection. Stop before starting a new one.
    deploy:
      replicas: 1
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-tam}
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-5000}
      IMPORT_PAGE_DELAY_MS: ${IMPORT_PAGE_DELAY_MS:-1000}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_DATABASE_URL: postgresql://tam:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tam_tg
      TELEGRAM_SESSION_KEY: ${TELEGRAM_SESSION_KEY:-}
      # Media downloads (README §9): the worker writes to every storage location, so it needs the
      # same folders, key and Google client as the api. Files for Google Drive wait in
      # /data/storage/.tam-tmp before the upload.
      STORAGE_LOCAL_ROOT: /data/storage
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-2048}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    volumes:
      - media:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    <<: *hardening
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
