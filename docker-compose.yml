# Unofficial Telegram Archive Manager — production-style stack for a Linux Docker host.
#   cp .env.example .env   # fill in POSTGRES_PASSWORD, REDIS_PASSWORD, ADMIN_*, TELEGRAM_*
#   docker compose up -d --build
# Services receive only the variables they need (no shared env_file): Telegram credentials reach
# the worker alone. Windows Server 2019 cannot run these Linux containers; validate on Linux with
# scripts/compose-smoke.sh. S3-compatible storage (RustFS profile) arrives in Phase 4.

name: tam

x-database-url: &database-url postgresql://tam:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tam
x-redis-url: &redis-url redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: tam
      POSTGRES_DB: tam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Same text semantics as the Windows dev database: UTF-8, builtin collation and a
      # Unicode-aware ctype (never plain C, or pg_trgm stops treating Vietnamese letters as letters).
      POSTGRES_INITDB_ARGS: >-
        --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8
    volumes:
      # PostgreSQL 18 images keep the cluster under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tam -d tam"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.11
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # The password goes into a config file, not onto the redis-server command line.
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass %s\nappendonly yes\nmaxmemory-policy noeviction\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: applies Prisma migrations, then exits.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: creates the first web admin from ADMIN_EMAIL / ADMIN_PASSWORD if no such user exists.
  bootstrap:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: *database-url
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    # The password is piped through stdin, never passed as an argument.
    command:
      - sh
      - -c
      - printf '%s' "$$ADMIN_PASSWORD" | node apps/api/dist/cli/create-user.js --email "$$ADMIN_EMAIL" --password-stdin --if-missing
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-tam}
      API_HOST: 0.0.0.0
      API_PORT: "3100"
      # Keep true behind HTTPS. false only for plain-HTTP LAN use (browsers drop Secure cookies on http).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_ABSOLUTE_TTL_DAYS: ${SESSION_ABSOLUTE_TTL_DAYS:-30}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      # nginx (web container) sits on the compose network; trust it for the client IP.
      TRUST_PROXY: loopback, uniquelocal
      # Storage locations (README §9). The api checks and serves the folders, so it mounts the same
      # media volume as the worker. To offer more folders, mount them into both containers
      # (e.g. /data/nas) and list them here, separated by ";".
      STORAGE_LOCAL_ROOT: /data/storage
      STORAGE_LOCAL_ROOTS: /data/storage
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    volumes:
      - media:/data/storage
    expose:
      - "3100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    init: true
    # Exactly one worker: it owns the single Telegram connection. Stop before starting a new one.
    deploy:
      replicas: 1
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-tam}
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-5000}
      IMPORT_PAGE_DELAY_MS: ${IMPORT_PAGE_DELAY_MS:-1000}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_DATABASE_URL: postgresql://tam:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tam_tg
      TELEGRAM_SESSION_KEY: ${TELEGRAM_SESSION_KEY:-}
      STORAGE_LOCAL_ROOT: /data/storage
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-2048}
    volumes:
      - media:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
