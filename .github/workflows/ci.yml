# Checks every push and pull request: static checks and unit tests, integration tests against
# PostgreSQL 18 and Redis 7.4, the browser tests, and the Docker stack (scripts/compose-smoke.sh).
# No secrets are needed: nothing reaches Telegram or Google.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'
  # Playwright's browsers are installed by the e2e job only.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  integration:
    name: Integration tests and coverage
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: tam
          POSTGRES_PASSWORD: tam-ci
          POSTGRES_DB: tam
          POSTGRES_INITDB_ARGS: >-
            --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
            --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tam -d tam" --health-interval 5s --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7.4.11
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://tam:tam-ci@localhost:5432/tam
      SHADOW_DATABASE_URL: postgresql://tam:tam-ci@localhost:5432/tam_shadow
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=tam-ci psql -h localhost -U tam -d tam -c 'CREATE DATABASE tam_shadow'
      - run: npm run build:packages
      - run: npm run db:deploy
      - run: npm run db:check
      # Unit and integration tests of every workspace, with the coverage minimums.
      - run: npm run test:coverage

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: tam
          POSTGRES_PASSWORD: tam-ci
          POSTGRES_DB: tam
          POSTGRES_INITDB_ARGS: >-
            --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
            --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tam -d tam" --health-interval 5s --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7.4.11
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://tam:tam-ci@localhost:5432/tam
      SHADOW_DATABASE_URL: postgresql://tam:tam-ci@localhost:5432/tam_shadow
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      - run: npm run build
      - run: npm run test:e2e
        env:
          PW_CHANNEL: bundled
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/e2e/test-results
            apps/e2e/playwright-report
          retention-days: 7

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/compose-smoke.sh
