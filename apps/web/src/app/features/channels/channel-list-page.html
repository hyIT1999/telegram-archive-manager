<app-page-header
  eyebrow="Library"
  title="Channels"
  subtitle="Telegram channels and groups kept in your archive."
/>

@if (hasError()) {
  <app-error-state
    title="Channels could not be loaded"
    [message]="errorMessage()"
    (retry)="retry()"
  />
} @else if (!loaded()) {
  <app-skeleton class="channel-skeleton" variant="card" [count]="6" label="Loading channels…" />
} @else if (channels().length === 0) {
  <app-empty-state
    class="surface-card"
    icon="forum"
    title="No channels archived yet"
    message="Import a Telegram channel or group you have access to and it will show up here."
  >
    <a matButton="filled" routerLink="/imports">
      <mat-icon>download</mat-icon>
      Go to Import Jobs
    </a>
  </app-empty-state>
} @else {
  <ul class="grid" aria-label="Archived channels">
    @for (channel of channels(); track channel.id) {
      <li>
        <app-channel-card [channel]="channel" />
      </li>
    }
  </ul>

  @if (nextCursor()) {
    <div class="more">
      @if (loadMoreError(); as message) {
        <p class="more-error" role="alert">{{ message }}</p>
      }
      <button
        matButton="tonal"
        type="button"
        [showProgress]="loadingMore()"
        [disabled]="loadingMore()"
        (click)="loadMore()"
      >
        Load more
        <mat-progress-spinner progressIndicator mode="indeterminate" diameter="18" />
      </button>
    </div>
  }
}
