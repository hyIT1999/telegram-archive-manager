<h2 mat-dialog-title>{{ editing ? 'Edit tag' : 'New tag' }}</h2>
<mat-dialog-content>
  <form id="tag-form" class="form" (submit)="$event.preventDefault(); save()">
    <mat-form-field>
      <mat-label>Name</mat-label>
      <input
        matInput
        required
        autocomplete="off"
        [value]="name()"
        [maxLength]="maxLength"
        (input)="onName($event)"
      />
      <mat-hint align="end">{{ length() }} / {{ maxLength }}</mat-hint>
    </mat-form-field>

    <fieldset class="colors">
      <legend>Color</legend>
      <div class="swatches" role="radiogroup" aria-label="Color">
        @for (option of colors; track option.value) {
          <button
            type="button"
            role="radio"
            class="swatch"
            [style.background]="option.value"
            [attr.aria-checked]="color() === option.value"
            [attr.aria-label]="option.name"
            (click)="color.set(option.value)"
          >
            @if (color() === option.value) {
              <mat-icon aria-hidden="true">check</mat-icon>
            }
          </button>
        }
        <button
          type="button"
          role="radio"
          class="swatch none"
          aria-label="No color"
          [attr.aria-checked]="color() === null"
          (click)="color.set(null)"
        >
          <mat-icon aria-hidden="true">{{ color() === null ? 'check' : 'block' }}</mat-icon>
        </button>
      </div>
    </fieldset>

    @if (error(); as message) {
      <app-notice tone="error">{{ message }}</app-notice>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" mat-dialog-close>Cancel</button>
  <button matButton="filled" type="submit" form="tag-form" [disabled]="!valid() || saving()">
    {{ editing ? 'Save' : 'Create tag' }}
  </button>
</mat-dialog-actions>
