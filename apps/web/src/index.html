<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unofficial Telegram Archive Manager</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Self-hosted archive for the Telegram channels and groups your account can access."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Blocking on purpose: sets data-theme before first paint (see public/theme-init.js). -->
    <script src="theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
    />
  </head>
  <body>
    <app-root>
      <div class="boot-splash" role="status">Opening the archive…</div>
    </app-root>
    <noscript>Unofficial Telegram Archive Manager needs JavaScript to run.</noscript>
  </body>
</html>
